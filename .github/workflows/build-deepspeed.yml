name: Build wheels

permissions: {}

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deepspeed_version:
        description: "DeepSpeed version"
        required: true
        default: "v0.19.2"
        type: string
  release:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name == 'workflow_dispatch' && inputs.deepspeed_version || 'v0.17.4' }}
  cancel-in-progress: true

jobs:
  plan-matrix:
    name: Plan DeepSpeed build matrix
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-build') }}
    permissions:
      contents: read # for actions/checkout
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: "0.9.26"
          enable-cache: false

      - name: Generate build matrix
        id: generate-matrix
        run: |
          echo "matrix=$(uv run --script plan-matrix.py)" >> $GITHUB_OUTPUT
        env:
          LIMIT_MATRIX: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-build') && '1' || '0' }}

  build-wheels:
    name: Build Wheels
    needs: [plan-matrix]
    runs-on: ${{ matrix.RUNNER }}
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-build') }}
    env:
      CUTLASS_VERSION: v3.8.0

    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan-matrix.outputs.matrix) }}

    steps:
      - name: Determine DeepSpeed version
        id: deepspeed-version
        run: |
          # Extract DeepSpeed version from tag. Tags can be either:
          # - v0.18.2 (legacy format; maps directly to DeepSpeed version)
          # - v0.18.2-r1 (new format; strip -rN suffix to get DeepSpeed version)
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            TAG="${GITHUB_REF_NAME}"
            # Remove -rN suffix if present
            DEEPSPEED_VERSION="${TAG%-r*}"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            DEEPSPEED_VERSION="${INPUTS_DEEPSPEED_VERSION}"
          else
            DEEPSPEED_VERSION="v0.19.2"
          fi
          echo "version=${DEEPSPEED_VERSION}" >> $GITHUB_OUTPUT
          echo "Using DeepSpeed version: ${DEEPSPEED_VERSION}"
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          INPUTS_DEEPSPEED_VERSION: ${{ inputs.deepspeed_version }}

      - name: Checkout Deepspeed
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: deepspeedai/DeepSpeed
          ref: ${{ steps.deepspeed-version.outputs.version }}
          persist-credentials: false

      - name: Get source commit SHA
        id: source-commit
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Checkout cutlass repo
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: NVIDIA/cutlass
          ref: ${{ env.CUTLASS_VERSION }}
          path: cutlass
          persist-credentials: false

      - name: Checkout utils
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          path: build_scripts
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: "0.9.26"
          enable-cache: false

      - name: Set CUDA and PyTorch versions ${{ matrix.torch-version }}+cu${{ matrix.cuda-version }}
        run: |
          echo "CI_CUDA_VERSION=$(echo ${{ matrix.CI_CUDA_VERSION }})" >> $GITHUB_ENV
          echo "CI_TORCH_VERSION=$(echo ${{ matrix.CI_TORCH_VERSION }})" >> $GITHUB_ENV
          echo "CI_PYTHON_VERSION=$(echo ${{ matrix.CI_PYTHON_VERSION }})" >> $GITHUB_ENV
          echo "MATRIX_CUDA_VERSION=$(echo ${{ matrix.MATRIX_CUDA_VERSION }})" >> $GITHUB_ENV
          echo "MATRIX_TORCH_VERSION=$(echo ${{ matrix.MATRIX_TORCH_VERSION }})" >> $GITHUB_ENV
          echo "MATRIX_PYTHON_VERSION=$(echo ${{ matrix.MATRIX_PYTHON_VERSION }})" >> $GITHUB_ENV
          echo "MANYLINUX_CUDA_VERSION=$(echo ${{ matrix.MANYLINUX_CUDA_VERSION }})" >> $GITHUB_ENV
          echo "MANYLINUX_CUDA_COMPAT_VERSION=$(echo ${{ matrix.MANYLINUX_CUDA_COMPAT_VERSION }})" >> $GITHUB_ENV
          echo "MANYLINUX_GLIBC_VERSION=$(echo ${{ matrix.MANYLINUX_GLIBC_VERSION }})" >> $GITHUB_ENV
          echo "CI_AUDITWHEEL_EXCLUDES=$(echo ${{ matrix.CI_AUDITWHEEL_EXCLUDES }})" >> $GITHUB_ENV
          # Avoid `echo` quoting to avoid interpreting the semicolon-delimited list as separate commands.
          echo "TORCH_CUDA_ARCH_LIST=\"${{ matrix.TORCH_CUDA_ARCH_LIST }}\"" >> $GITHUB_ENV

      - name: Install cibuildwheel
        run: |
          uv venv --python 3.13
          uv pip install cibuildwheel

      - name: Build wheels for Pytorch ${{ matrix.torch-version }}+cu${{ matrix.cuda-version }}
        run: |
          .venv/bin/cibuildwheel --output-dir dist
        env:
          CIBW_ARCHS_LINUX: ${{ matrix.target-arch }}
          CIBW_BUILD: cp${{ env.MATRIX_PYTHON_VERSION }}-*64
          CIBW_MANYLINUX_X86_64_IMAGE: pytorch/manylinux2_28-builder:cuda${{ env.MANYLINUX_CUDA_VERSION }}
          CIBW_MANYLINUX_AARCH64_IMAGE: pytorch/manylinuxaarch64-builder:cuda${{ env.MANYLINUX_CUDA_VERSION }}
          CIBW_BEFORE_ALL: >
            curl -LsSf https://astral.sh/uv/install.sh | sh
          # TODO(charlie): The PyTorch CUDA 12.9 index is missing cuda-bindings==12.9.4, but PyTorch 2.10 depends on it.
          CIBW_BEFORE_BUILD_LINUX: >
            (yes | dnf config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo || true) &&
            (yum install -y cuda-driver-devel-${{ env.MANYLINUX_CUDA_COMPAT_VERSION }} || true) &&
            (yum install -y glibc glibc-devel || apt-get install -y libc6-dev || apk add --update --no-cache musl-dev || true) &&
            (yum install -y libffi-devel || apt-get install -y libffi-devel || apk add --update --no-cache libffi-devel || true) &&
            uv pip install --system setuptools hjson ninja numpy packaging psutil py-cpuinfo pydantic pynvml tqdm libaio deepspeed-kernels triton &&
            if [ "${MATRIX_CUDA_VERSION}" = "129" ] && [ "${MATRIX_TORCH_VERSION}" = "2.10" ]; then uv pip install --system cuda-bindings==12.9.4; fi &&
            uv pip install --system --no-cache-dir torch==${{ matrix.torch-version }} --index-url https://download.pytorch.org/whl/cu${MATRIX_CUDA_VERSION} &&
            bash build_scripts/prepare_for_build.sh ${{ steps.deepspeed-version.outputs.version }}
          CIBW_ENVIRONMENT: >
            PATH=$PATH:/root/.local/bin
            CUDA_HOME="/usr/local/cuda-${{ env.MANYLINUX_CUDA_VERSION }}"
            LIBRARY_PATH="/usr/lib64"
            LD_LIBRARY_PATH="/usr/lib64:/usr/local/cuda-${{ env.MANYLINUX_CUDA_VERSION }}/lib64:/usr/local/cuda-${{ env.MANYLINUX_CUDA_VERSION }}/targets/${{ matrix.target-arch }}-linux/lib:/usr/local/cuda-${{ env.MANYLINUX_CUDA_VERSION }}/extras/CUPTI/lib64"
            LDFLAGS="-ldl -L/usr/local/cuda-${{ env.MANYLINUX_CUDA_VERSION }}/targets/${{ matrix.target-arch }}-linux/lib/stubs"
            CCL_ROOT="/project/oneCCL/build/_install"
            CPATH="/project/oneCCL/build/_install/include"
            CUTLASS_PATH=/project/cutlass
            AUDITWHEEL_PLAT="manylinux_${{ env.MANYLINUX_GLIBC_VERSION }}_$(uname -m)"
            MATRIX_CUDA_VERSION=${{ env.MATRIX_CUDA_VERSION }}
            MATRIX_TORCH_VERSION=${{ env.MATRIX_TORCH_VERSION }}
            MATRIX_PYTHON_VERSION=${{ env.MATRIX_PYTHON_VERSION }}
            CI_CUDA_VERSION=${{ env.CI_CUDA_VERSION }}
            CI_TORCH_VERSION=${{ env.CI_TORCH_VERSION }}
            CI_PYTHON_VERSION=${{ env.CI_PYTHON_VERSION }}
            CI_AUDITWHEEL_EXCLUDES="${{ env.CI_AUDITWHEEL_EXCLUDES }}"
            TORCH_CUDA_ARCH_LIST=${{ env.TORCH_CUDA_ARCH_LIST }}
            DS_ACCELERATOR=cuda
            DS_BUILD_OPS=1
            DS_BUILD_DEEP_COMPILE=${{ matrix.deepcompile }}
            DS_BUILD_EVOFORMER_ATTN=0
            UV_PYTHON=/opt/python/cp${{ env.MATRIX_PYTHON_VERSION }}-cp${{ env.MATRIX_PYTHON_VERSION }}/bin/python
          CIBW_SKIP: "*musllinux*"
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: "auditwheel repair -w /tmp/cibuildwheel/repaired_wheel {wheel} ${CI_AUDITWHEEL_EXCLUDES}"
          CIBW_TEST_COMMAND: (DS_ACCELERATOR=cuda ds_report || true) && (DS_ACCELERATOR=cpu ds_report || true)
          CIBW_BUILD_FRONTEND: "build[uv]; args: --no-isolation"

      - name: Embed metadata into wheel
        run: |
          for wheel in dist/*.whl; do
            uv run --script build_scripts/embed_patches.py "$wheel" "build_scripts/patches/${DEEPSPEED_VERSION}" \
              --source-repo "https://github.com/deepspeedai/DeepSpeed" \
              --source-tag "${DEEPSPEED_VERSION}" \
              --source-commit "${SOURCE_COMMIT}" \
              --build-repo "https://github.com/astral-sh-build/build-deepspeed" \
              --build-commit "${BUILD_COMMIT}" \
              --license-expression "Apache-2.0 AND BSD-3-Clause AND MIT" \
              --license-file "LICENSE:LICENSE" \
              --license-file "build_scripts/licenses/nvidia-apex/LICENSE.txt:third-party/nvidia-apex/LICENSE.txt" \
              --license-file "build_scripts/licenses/nvidia-apex/SOURCE.txt:third-party/nvidia-apex/SOURCE.txt" \
              --license-file "build_scripts/licenses/fairscale/LICENSE.txt:third-party/fairscale/LICENSE.txt" \
              --license-file "build_scripts/licenses/fairscale/SOURCE.txt:third-party/fairscale/SOURCE.txt" \
              --license-file "build_scripts/licenses/tecorigin-sdaa/BSD-3-Clause.txt:third-party/tecorigin-sdaa/BSD-3-Clause.txt" \
              --license-file "build_scripts/licenses/tecorigin-sdaa/SOURCE.txt:third-party/tecorigin-sdaa/SOURCE.txt" \
              --license-file "build_scripts/licenses/muon/MIT.txt:third-party/muon/MIT.txt" \
              --license-file "build_scripts/licenses/muon/SOURCE.txt:third-party/muon/SOURCE.txt"
          done
        env:
          DEEPSPEED_VERSION: ${{ steps.deepspeed-version.outputs.version }}
          SOURCE_COMMIT: ${{ steps.source-commit.outputs.sha }}
          BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Log Built Wheels
        run: |
          wheel_name=$(ls dist/*whl | xargs -n 1 basename)
          echo "wheel_name=${wheel_name}" >> $GITHUB_ENV
          ls dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name != 'release'
        with:
          name: ${{env.wheel_name}}
          path: dist/${{env.wheel_name}}
          if-no-files-found: error

      - name: Upload wheels to release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" ./dist/*.whl --clobber --repo "${GITHUB_REPOSITORY}"
