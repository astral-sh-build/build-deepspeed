name: Publish built wheels
run-name: Publish ${{ inputs.release_tag }} from build ${{ inputs.build_run_id }}

permissions: {}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag at the build commit"
        required: true
        type: string
      build_run_id:
        description: "Completed release build with successful wheel jobs"
        required: true
        type: string

jobs:
  publish:
    name: Publish wheels
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Verify build provenance
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          BUILD_WORKFLOW: "build-deepspeed.yml"
          BUILD_JOB_PREFIX: "Build Wheels"
        run: |
          set -euo pipefail
          [[ "${BUILD_RUN_ID}" =~ ^[0-9]+$ ]]
          tag_commit=$(gh api "repos/${GITHUB_REPOSITORY}/commits/refs/tags/${RELEASE_TAG}" --jq .sha)
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}" > build.json
          jq -e --arg sha "${tag_commit}" --arg path ".github/workflows/${BUILD_WORKFLOW}" '
            .head_sha == $sha and .path == $path and
            .event == "workflow_dispatch" and .status == "completed"
          ' build.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}/jobs?per_page=100&filter=all" > jobs.json
          jq --arg prefix "${BUILD_JOB_PREFIX}" '
            [.[].jobs[]] | group_by(.name) | map(max_by(.run_attempt)) |
            map(select(.name | startswith($prefix)))
          ' jobs.json > wheel-jobs.json
          jq -e 'length > 0 and all(.[]; .conclusion == "success")' wheel-jobs.json
          echo "expected-wheels=$(jq length wheel-jobs.json)" >> "${GITHUB_OUTPUT}"

      - name: Download built wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
          path: dist
          merge-multiple: true

      - name: Publish existing release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_WHEELS: ${{ steps.build.outputs.expected-wheels }}
        run: |
          set -euo pipefail
          wheel_count=$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)
          test "${wheel_count}" -eq "${EXPECTED_WHEELS}"
          for attempt in 1 2 3; do
            if gh release create "${RELEASE_TAG}" ./dist/*.whl --verify-tag \
              --title "${RELEASE_TAG}" --notes "" --repo "${GITHUB_REPOSITORY}" \
              2> release-error.log; then
              break
            fi
            cat release-error.log >&2
            if [ "${attempt}" -eq 3 ] || ! grep -Fq \
              "HTTP 404: Not Found (https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/" \
              release-error.log; then
              exit 1
            fi
            # gh removes its draft after a failed upload. Retry only after
            # confirming that no release remains; never overwrite a release.
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
              > /dev/null 2> release-state.log; then
              echo "A release already exists; inspect it before retrying." >&2
              exit 1
            fi
            if ! grep -Fq '(HTTP 404)' release-state.log; then
              cat release-state.log >&2
              exit 1
            fi
            sleep 10
          done
