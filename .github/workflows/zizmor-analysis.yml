name: Zizmor Static Analysis

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Zizmor
        run: pip install zizmor

      - name: Run Zizmor analysis
        run: |
          # Run Zizmor and output results directly to the logs
          zizmor . --format plain
          
          # Also save results as JSON for artifact
          zizmor . --format json > zizmor-results.json

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: zizmor-analysis-results
          path: zizmor-results.json
