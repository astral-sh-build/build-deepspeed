name: Zizmor Static Analysis

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@cda7432b7ae1feb69168d44b610cb8e3cdbd09b0

      - name: Run Zizmor analysis
        run: |
          # Run Zizmor and output results directly to the logs
          # Use || true to prevent non-zero exit code from failing the workflow
          uvx zizmor . --format plain || true
          
          # Also save results as JSON for artifact
          uvx zizmor . --format json > zizmor-results.json || true

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: zizmor-analysis-results
          path: zizmor-results.json
