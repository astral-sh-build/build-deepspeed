name: Zizmor Static Analysis

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read
  security-events: write  # Needed for GitHub code scanning integration

jobs:
  analyze:
    name: Analyze Workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Zizmor
        run: pip install zizmor

      - name: Run Zizmor analysis
        run: |
          # Run Zizmor and output results in SARIF format for GitHub code scanning
          zizmor . --format sarif > zizmor-results.sarif

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: zizmor-results.sarif
          category: zizmor
